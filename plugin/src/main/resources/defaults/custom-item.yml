# 복잡한 아이템을 이름으로 등록하고 Api.yml의 custom-give에서 {item.키}로 참조합니다.
# name/lore 등 문자열에는 placeholder와 & 색상 코드(&l 굵게 포함)를 사용할 수 있습니다.
# amount는 고정 숫자 또는 "<1..3>" 범위를 지원합니다.
items:
  donation_diamond:
    # material은 Bukkit Material 이름 또는 minecraft:diamond 형식을 사용합니다.
    material: "DIAMOND"
    amount: 1
    name: "&b후원 다이아몬드"
    lore:
      - "&7후원자: {donator}"
      - "&7금액: {amount}"
    glow: true
    # persistentData 타입: string, int, long, double, boolean
    # 숫자/boolean 타입 값에는 placeholder를 쓸 수 없으며, 동적 값은 string으로 저장하세요.
    persistentData:
      - key: "mcstreamapi:item_id"
        type: "string"
        value: "donation_diamond"
      - key: "mcstreamapi:donation_amount"
        type: "long"
        value: 1000

  rare_emerald:
    material: "EMERALD"
    amount: "<1..3>"
    name: "&a희귀 에메랄드"
    # enchantments는 인챈트 ID: 레벨 형식입니다.
    enchantments:
      minecraft:unbreaking: 1
    # Bukkit ItemFlag 이름이며 잘못된 값은 무시됩니다.
    itemFlags:
      - "HIDE_ENCHANTS"
