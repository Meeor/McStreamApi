# 액션에서 {random.키} 또는 {random_once.키}로 사용할 랜덤 테이블입니다.
# random은 한 후원 이벤트 안에서 결과를 재사용하고, random_once는 호출할 때마다 다시 뽑습니다.
# chat/broadcast/title에서 아이템·몹·버프 값은 플레이어의 클라이언트 언어로 자동 번역됩니다.
# display를 직접 작성하면 자동 번역 대신 작성한 표시명이 우선합니다.
monster_random:
  # 객체 목록은 value(실제 값), chance(가중치), amount(summon 수량), display(표시명)를 지원합니다.
  # chance 합계는 100일 필요가 없고, 생략 시 100이며 0 이하는 제외됩니다.
  - value: "zombie"
    chance: 50
    amount: 1
  - value: "skeleton"
    chance: 30
    amount: 2
  - value: "creeper"
    chance: 20
    amount: "<1..3>"

animal_random:
  # 단순 문자열 목록은 각 항목이 같은 기본 가중치(100)를 가집니다.
  - "cow"
  - "pig"
  - "chicken"

buff_random:
  - "speed"
  - "haste"
  - "strength"

debuff_random:
  - "slowness"
  - "weakness"
  - "blindness"

item_random:
  - "diamond"
  - "emerald"
  - "gold_ingot"

food_random:
  - "apple"
  - "bread"
  - "cooked_beef"

ore_random:
  - "coal_ore"
  - "iron_ore"
  - "diamond_ore"
