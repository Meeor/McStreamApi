# 커스텀 아이템 설정
# Api.yml의 custom-give에서 item: "{item.아이템키}"로 참조합니다.
# [필수] material만 반드시 필요하며 나머지는 모두 선택입니다.
# 문자열에는 색상 코드와 후원 placeholder를 사용할 수 있습니다.
# amount 범위는 이벤트마다 한 번 뽑혀 {item.키.amount}와 실제 지급 수량에 같이 사용됩니다.

# items:
#   donation_diamond: # 아이템키: 자유롭게 정하며 {item.donation_diamond}로 사용합니다.
#     material: "DIAMOND" # [필수] Bukkit Material 또는 minecraft:diamond 형식입니다.
#     amount: 1            # [선택, 기본값: 1] 숫자, "<1..3>", "<..100>"을 지원합니다.
#     name: "&b후원 다이아몬드" # [선택] 표시 이름입니다.
#     lore:                       # [선택] 설명 줄 목록입니다.
#       - "&7후원자: {donator}"
#       - "&7금액: {amount}"
#     customModelData: 1001 # [선택] 리소스팩 CustomModelData 정수입니다.
#     unbreakable: true     # [선택] true면 내구도가 감소하지 않습니다.
#     glow: true            # [선택] 인챈트 없이 반짝임을 표시합니다. glint도 같은 뜻입니다.
#     itemFlags:            # [선택] Bukkit ItemFlag 이름입니다. 잘못된 값은 경고 후 무시합니다.
#       - "HIDE_ENCHANTS"
#       - "HIDE_ATTRIBUTES"
#     enchantments:         # [선택] 인챈트 목록입니다.
#       - enchantment: "minecraft:unbreaking" # [필수] Minecraft 인챈트 ID입니다.
#         level: 3                            # [선택, 기본값: 1] 인챈트 레벨입니다.
#         ignoreLevelRestriction: true        # [선택, 기본값: true] 일반 최대 레벨을 넘길 수 있는지 정합니다.
#     persistentData:       # [선택] 다른 플러그인이 읽을 PDC 값입니다.
#       - key: "mcstreamapi:item_id" # [필수] namespace:key. namespace 생략 시 이 플러그인 namespace를 사용합니다.
#         type: "string"             # [필수] string/int/long/double/boolean 중 하나입니다.
#         value: "donation_diamond"  # [필수] string만 placeholder 사용을 권장합니다.
#       - key: "mcstreamapi:donation_amount"
#         type: "long"
#         value: 1000
#     attributes:           # [선택] 아이템 착용/사용 시 적용할 속성입니다.
#       - attribute: "minecraft:generic.attack_damage" # [필수] Minecraft attribute ID입니다.
#         amount: 2.0                                  # [필수] 증감 수치입니다.
#         operation: "ADD_NUMBER"                     # [선택, 기본값: ADD_NUMBER] Bukkit Operation 이름입니다.
#         slot: "mainhand"                            # [선택, 기본값: any] hand/mainhand/offhand/armor 등 슬롯 그룹입니다.
#         name: "donation_damage"                     # [현재 미사용] 향후 modifier 식별 이름용 예약 값입니다.

#   rare_emerald:
#     material: "EMERALD"
#     amount: "<1..3>"
#     name: "&a희귀 에메랄드"
    # enchantments는 아래처럼 ID: 레벨 축약형으로도 작성할 수 있습니다.
